# Dependabot version updates (security alerts work without this file; this adds
# scheduled PRs that keep dependencies current so alerts have less to catch).
# See https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # vitest 5 breaks @cloudflare/vitest-plugin 1.4.2 (test files crash with a .vitest-cache
      # readAll error). Remove once the plugin works with vitest 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all routine bumps instead of one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes grouped the same way, kept apart from routine bumps.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
